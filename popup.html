<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <style>
    body{font-family:system-ui,sans-serif;width:260px;padding:12px;font-size:14px}
    input{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:6px}
    button{padding:6px 12px;margin-top:6px}
    #msg{margin-top:8px;min-height:18px;color:#b00}
    .ok{color:#080 !important}
    label{font-size:12px;color:#555}
    #state{font-weight:600;margin-bottom:4px}
    .on{color:#b00}
    .off{color:#080}
    hr{border:0;border-top:1px solid #ddd;margin:10px 0}
  </style>
</head>
<body>
  <div id="state"></div>
  <div id="status"></div>

  <form id="setup" hidden>
    <label>Utwórz hasło rodzica</label>
    <input type="password" id="pw1" autocomplete="off">
    <label>Powtórz hasło</label>
    <input type="password" id="pw2" autocomplete="off">
    <button type="submit">Zapisz hasło</button>
  </form>

  <form id="manage" hidden>
    <hr>
    <label>Hasło rodzica</label>
    <input type="password" id="pw" autocomplete="off">
    <button type="button" id="toggle"></button>
    <hr>
    <label>Ustaw liczbę pozostałych odcinków (0 = zablokuj teraz)</label>
    <input type="number" id="n" min="0" max="50" value="1">
    <button type="submit">Zastosuj</button>
  </form>

  <div id="msg"></div>
  <div id="ver" style="margin-top:8px;font-size:11px;color:#999"></div>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
