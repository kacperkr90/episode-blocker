name: Build

# Every push and pull request: check, test and package the extension.
# Pushing a tag vX.Y.Z (matching "version" in manifest.json) also publishes the zip
# as a GitHub release, for manual download and install.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: for f in *.js tools/*.js tests/*.js; do node --check "$f"; done

      - name: Check manifest is in sync with lib.js
        run: node tools/sync-manifest.js --check

      - name: Run tests
        run: node --test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.zip.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Package extension
        id: zip
        # Only the files Chrome loads; docs, tools, tests and the wiki stay out of the package.
        run: |
          version=$(jq -r .version manifest.json)
          mkdir dist
          zip -r "dist/episode-limit-$version.zip" manifest.json *.js *.html _locales
          unzip -l "dist/episode-limit-$version.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ZIP: dist/episode-limit-${{ needs.build.outputs.version }}.zip
    steps:
      - name: Check tag matches manifest version
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $VERSION"
            exit 1
          fi

      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension
          path: dist

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
