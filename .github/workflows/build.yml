name: Build

# Every push and pull request: check, test and package the extension.
# On main, release-please keeps a release PR open that bumps "version" in manifest.json and
# CHANGELOG.md from the conventional commits since the last release. Merging that PR tags vX.Y.Z,
# creates the GitHub release and attaches the zip, for manual download and install.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: for f in *.js tools/*.js tests/*.js; do node --check "$f"; done

      - name: Check manifest is in sync with lib.js
        run: node tools/sync-manifest.js --check

      - name: Run tests
        run: node --test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.zip.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Package extension
        id: zip
        # Only the files Chrome loads; docs, tools, tests and the wiki stay out of the package.
        run: |
          version=$(jq -r .version manifest.json)
          mkdir dist
          zip -r "dist/episode-limit-$version.zip" manifest.json *.js *.html _locales
          unzip -l "dist/episode-limit-$version.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: dist/*.zip
          if-no-files-found: error

  release-please:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Configured by release-please-config.json and .release-please-manifest.json.
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1

  # Tags pushed with GITHUB_TOKEN do not start new workflow runs, so the zip is attached here,
  # in the run of the merged release PR.
  publish:
    needs: [build, release-please]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      ZIP: dist/episode-limit-${{ needs.build.outputs.version }}.zip
    steps:
      - name: Check tag matches manifest version
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $VERSION"
            exit 1
          fi

      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension
          path: dist

      - name: Attach package to GitHub release
        run: gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
